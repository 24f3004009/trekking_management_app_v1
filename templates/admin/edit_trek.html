{% extends "base.html" %}

{% block content %}
<h2>Edit Trek</h2>
<form method="POST">
    <div class="mb-3">
        <label class="form-label">Trek Name</label>
        <input type="text" name="name" class="form-control" value="{{ trek.name }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Location</label>
        <input type="text" name="location" class="form-control" value="{{ trek.location }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Difficulty</label>
        <select name="difficulty" class="form-select" required>
            <option value="Easy" {% if trek.difficulty == 'Easy' %}selected{% endif %}>Easy</option>
            <option value="Moderate" {% if trek.difficulty == 'Moderate' %}selected{% endif %}>Moderate</option>
            <option value="Hard" {% if trek.difficulty == 'Hard' %}selected{% endif %}>Hard</option>
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label">Duration (days)</label>
        <input type="number" name="duration" class="form-control" value="{{ trek.duration }}" min="1" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Available Slots</label>
        <input type="number" name="available_slots" class="form-control" value="{{ trek.available_slots }}" min="0" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Status</label>
        <select name="status" class="form-select" required>
            {% for s in ['Pending', 'Approved', 'Open', 'Closed', 'Started', 'Completed'] %}
            <option value="{{ s }}" {% if trek.status == s %}selected{% endif %}>{{ s }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label">Start Date</label>
        <input type="date" name="start_date" class="form-control" value="{{ trek.start_date }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">End Date</label>
        <input type="date" name="end_date" class="form-control" value="{{ trek.end_date }}" required>
    </div>
    <button type="submit" class="btn btn-primary">Save Changes</button>
</form>
{% endblock %}
