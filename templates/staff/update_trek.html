{% extends "base.html" %}

{% block content %}
<h2>Update: {{ trek.name }}</h2>

<form method="POST">
    <div class="mb-3">
        <label class="form-label">Available Slots</label>
        <input type="number" name="available_slots" class="form-control" value="{{ trek.available_slots }}" min="0" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Status</label>
        <select name="status" class="form-select" required>
            {% for s in ['Open', 'Closed', 'Started', 'Completed'] %}
                <option value="{{ s }}" {% if trek.status == s %}selected{% endif %}>{{ s }}</option>
            {% endfor %}
        </select>
    </div>
    <button type="submit" class="btn btn-primary">Save Changes</button>
</form>
{% endblock %}
